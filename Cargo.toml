[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/trace",
    "crates/analysis",
    "crates/cli",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"  # let-chains
license = "MIT"
authors = ["Kassem Kanjo"]
repository = "https://github.com/kassem-kanjo/switchyard"

[workspace.dependencies]
switchyard-core = { path = "crates/core", version = "0.1.0" }
switchyard-trace = { path = "crates/trace", version = "0.1.0" }
switchyard-analysis = { path = "crates/analysis", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
toml = "0.9"
# default-features = false keeps getrandom (and OS entropy) out of the build:
# the sim must never seed itself from the environment (ADR 0002), and it keeps
# the crate building for wasm32-unknown-unknown without the `js` shim.
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
# No "color" feature: it pulls in anstream -> windows-sys, which needs
# dlltool on the windows-gnu toolchain (see ARCHITECTURE §9).
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
wasm-bindgen = "0.2"
# Property tests (dev only). No default features: "fork"/"timeout" pull in
# process-spawning helpers we do not need.
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_arithmetic = "allow"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Keep overflow checks in release so the sim behaves identically in debug and
# release builds (determinism contract, ADR 0002).
overflow-checks = true
debug = 1
