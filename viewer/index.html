<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Switchyard</title>
</head>
<body>
  <div id="app">
    <header id="bar">
      <h1>Switchyard</h1>
      <span id="badge" hidden title="The WASM simulation failed to load">mock data</span>
      <label>Preset
        <select id="preset">
          <option value="small">small</option>
          <option value="medium">medium</option>
          <option value="large">large</option>
          <option value="aisle-7-blocked">aisle-7-blocked</option>
          <option value="peak-surge">peak-surge</option>
          <option value="two-dead-robots-and-a-jam">two-dead-robots-and-a-jam</option>
        </select>
      </label>
      <span id="fleet" title="active / parked robots">active 0 / parked 0</span>
      <span id="stats">delivered 0 · 0.0 / h</span>
      <button id="play" type="button">Pause</button>
      <label>Speed
        <select id="speed">
          <option value="1">1×</option>
          <option value="4" selected>4×</option>
          <option value="16">16×</option>
          <option value="64">64×</option>
        </select>
      </label>
      <span id="tick">tick 0</span>
    </header>
    <main id="main">
      <section id="floor" aria-label="Sortation floor">
        <div id="stage"><canvas id="canvas"></canvas></div>
        <div id="legend" aria-label="Legend"></div>
      </section>
      <aside id="side" aria-label="Analysis">
        <div class="chart-card">
          <header>
            <h2>Delivered per minute</h2>
            <div class="key">
              <span><i></i>actual</span>
              <span><i class="twin"></i>fault-free twin</span>
              <span><i class="fault"></i>fault</span>
            </div>
          </header>
          <canvas id="chart" aria-label="Throughput chart"></canvas>
        </div>
        <div id="tabbar"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
