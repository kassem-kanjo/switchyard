<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Switchyard</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1d2330; color: #e6e9ef; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #262d3d; border-bottom: 1px solid #343d52; }
    #bar h1 { margin: 0; font-size: 16px; font-weight: 600; margin-right: auto; }
    #bar button, #bar select { font: inherit; padding: 4px 10px; background: #323b52; color: inherit; border: 1px solid #44506b; border-radius: 4px; }
    #stats { font-variant-numeric: tabular-nums; opacity: 0.85; }
    #badge { background: #7a4b12; color: #ffd9a0; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    #badge[hidden] { display: none; }
    #tick { font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
    #legend { flex: none; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 14px; background: #262d3d; border-top: 1px solid #343d52; font-size: 12px; }
    #legend span.item { display: inline-flex; align-items: center; gap: 5px; }
    #legend i { width: 10px; height: 10px; display: inline-block; box-sizing: border-box; }
    #legend i.outlined { border: 1.5px solid; }
    #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #stage { flex: 1; min-height: 0; position: relative; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="app">
    <header id="bar">
      <h1>Switchyard</h1>
      <span id="badge" hidden title="The WASM simulation failed to load">mock data</span>
      <label>Preset
        <select id="preset">
          <option value="small">small</option>
          <option value="medium">medium</option>
          <option value="large">large</option>
        </select>
      </label>
      <span id="fleet" title="active / parked robots">active 0 / parked 0</span>
      <span id="stats">delivered 0 · 0.0 / h</span>
      <button id="play" type="button">Pause</button>
      <label>Speed
        <select id="speed">
          <option value="1">1×</option>
          <option value="4" selected>4×</option>
          <option value="16">16×</option>
          <option value="64">64×</option>
        </select>
      </label>
      <span id="tick">tick 0</span>
    </header>
    <main id="main"><div id="stage"><canvas id="canvas"></canvas></div><div id="legend" aria-label="Legend"></div></main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
