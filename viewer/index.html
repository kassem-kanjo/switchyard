<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Switchyard</title>
</head>
<body>
  <div id="app" class="app">
    <header id="bar" class="top">
      <span class="brand">SWITCHYARD</span>
      <span id="badge" hidden title="The WASM simulation failed to load">mock data</span>
      <span class="sep"></span>
      <span class="lbl">Site</span><span id="site" class="sel">-</span>
      <label class="lbl">Scenario
        <select id="preset" class="sel">
          <option value="small">small</option>
          <option value="medium">medium</option>
          <option value="large">large</option>
          <option value="aisle-7-blocked">aisle-7-blocked</option>
          <option value="peak-surge">peak-surge</option>
          <option value="two-dead-robots-and-a-jam">two-dead-robots-and-a-jam</option>
        </select>
      </label>
      <span class="sep"></span>
      <div class="ctl" id="speeds" role="group" aria-label="Simulation speed">
        <button id="play" type="button" aria-label="Pause">❚❚</button>
        <button type="button" data-speed="1" class="on">1×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="16">16×</button>
        <button type="button" data-speed="64">64×</button>
      </div>
      <span id="incident-chip" class="chip d" hidden></span>
      <span class="lbl push">Throughput</span><span id="stats" class="mono">-</span><span id="dip" class="mono dip"></span>
      <span class="lbl">Shift time</span><span id="tick" class="mono">00:00:00</span>
    </header>

    <nav id="rail" class="rail" aria-label="Objects"></nav>

    <section id="floor" class="canvas" aria-label="Sortation floor">
      <div id="stage"><canvas id="canvas"></canvas><div id="focus" aria-hidden="true"></div></div>
      <div class="hud"><span id="focus-chip" class="chip d" hidden></span><span id="fleet" class="chip" title="active / parked robots">active 0 / parked 0</span></div>
      <div id="legend" aria-label="Legend"></div>
    </section>

    <aside id="side" class="insp" aria-label="Inspector">
      <div id="tabbar"></div>
    </aside>

    <section id="timeline" class="tl" aria-label="Timeline"></section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
