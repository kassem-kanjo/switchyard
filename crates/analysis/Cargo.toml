[package]
name = "switchyard-analysis"
description = "Metrics, incident detection, resilience scoring and counterfactual root-cause analysis for Switchyard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
switchyard-core.workspace = true
switchyard-trace.workspace = true
# Replays of a post-mortem are independent sims: rayon runs them in
# parallel and collects in a fixed order (ADR 0006, section 7).
rayon = "1"

[dev-dependencies]
rayon = "1"
proptest.workspace = true
insta = { version = "1", default-features = false }

[lints]
workspace = true
