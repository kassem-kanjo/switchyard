name: release

# Builds the `switchyard` CLI for each platform and attaches it to the GitHub
# release, so people can run it without installing Rust.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the wasm target
        shell: bash
        run: rustup target add wasm32-unknown-unknown
      # Releases run rarely, so installing the CLI is cheaper than caching it.
      # The version must match wasm-bindgen in Cargo.lock.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci
      - name: Build viewer
        working-directory: viewer
        run: npm run build
      - name: Build
        run: cargo build --release --locked -p switchyard-cli --features embed-viewer --target ${{ matrix.target }}
      - name: Smoke test (view)
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/switchyard"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          log="${RUNNER_TEMP:-/tmp}/view.log"
          "$bin" view --no-open --port 8765 > "$log" 2>&1 &
          pid=$!
          fail() {
            echo "view smoke test failed: $1" >&2
            cat "$log" >&2 || true
            kill "$pid" 2>/dev/null || true
            exit 1
          }
          # HEAD requests keep curl away from /dev/null output files, which
          # the Windows curl cannot open.
          check() {
            h=$(curl -sI "http://127.0.0.1:8765$1" | tr -d '\r' | tr 'A-Z' 'a-z') || h=""
            printf '%s\n' "$h" | grep -q '^http/1.1 200' || fail "GET $1 was not 200: $h"
            printf '%s\n' "$h" | grep -q "^content-type: $2" || fail "GET $1 has the wrong content type: $h"
          }
          ready=0
          for _ in $(seq 1 40); do
            if curl -fs "http://127.0.0.1:8765/" > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          [ "$ready" = 1 ] || fail "server did not answer on 127.0.0.1:8765 within 20s"
          check / text/html
          wasm=$(find viewer/dist -name '*.wasm' | head -1)
          [ -n "$wasm" ] || fail "no .wasm file found under viewer/dist"
          check "/${wasm#viewer/dist/}" application/wasm
          kill "$pid"
          echo "view smoke test passed"
      - name: Package
        shell: bash
        run: |
          name="switchyard-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/switchyard.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/switchyard" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
