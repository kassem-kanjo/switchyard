# Switchyard chaos preset: aisle 7 blocked.
#
# A spill closes vertical aisle 7 (columns x = 22 and 23, the 7th two-cell
# aisle from the west wall) from the first chute row down to the induction
# stations, for 20 minutes from minute 30. Only the north perimeter aisle
# still connects the west and east halves of the floor, so robots detour
# around it and the stations west of the block are starved of robots.
#
# Base: the medium preset (crates/core/scenarios/medium.toml), unchanged
# apart from the name and the fault schedule below. Run it with
#   switchyard chaos --scenario aisle-7-blocked --ticks 14400 --seeds 1..5
# which scores each seed against its fault-free twin (same seed, no faults).
# Times are ticks (1 tick = 0.5 s): 3600 = minute 30.
# Source of truth: crates/core/scenarios/chaos/; the copy in the
# repository's scenarios/chaos/ directory must match it.

name = "aisle-7-blocked"
seed = 1

[floor]
# 64 x 54 cells: a 20 x 15 chute lattice (300 chutes).
width = 64
height = 54
stations = 8
south_margin = 6

[fleet]
robots = 200
# Robots that may head to (or load at) one station at once.
max_inbound_per_station = 6

[arrivals]
# 8 stations x 800/h = 6,400 parcels/h offered (32 per robot per hour).
parcels_per_hour_per_station = 800
destinations = 300
zipf_s_milli = 800

[timing]
# Scan-and-place at induction: 4 ticks = 2 s (about 1,200/h per station at
# full utilisation).
load_ticks = 4
drop_ticks = 2

[chutes]
bag_capacity = 50
bag_swap_ticks = 60
mapping = "popularity_near_induction"

[scanner]
error_rate_ppm = 0

[guidance]
against_flow_cost = 3

[planner]
watchdog_ticks = 600

[[faults]]
kind = "aisle-block"
at = 3600
duration = 2400
cells = [
    [22, 3], [23, 3], [22, 4], [23, 4], [22, 5], [23, 5],
    [22, 6], [23, 6], [22, 7], [23, 7], [22, 8], [23, 8],
    [22, 9], [23, 9], [22, 10], [23, 10], [22, 11], [23, 11],
    [22, 12], [23, 12], [22, 13], [23, 13], [22, 14], [23, 14],
    [22, 15], [23, 15], [22, 16], [23, 16], [22, 17], [23, 17],
