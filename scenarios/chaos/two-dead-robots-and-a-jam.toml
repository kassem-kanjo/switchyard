# Switchyard chaos preset: two dead robots and a jam.
#
# At minute 30 the chute serving the most popular destination (C289, in the
# chute row nearest the stations) jams for 15 minutes, and robots R57 and
# R119 break down where they stand for 20 minutes. Robots carrying parcels
# for the jammed chute queue beside it, so one jam ties up a large share of
# the fleet: the cascade the twin comparison makes visible.
#
# Base: the medium preset (crates/core/scenarios/medium.toml), unchanged
# apart from the name and the fault schedule below. Run it with
#   switchyard chaos --scenario two-dead-robots-and-a-jam --ticks 14400 --seeds 1..5
# which scores each seed against its fault-free twin (same seed, no faults).
# Times are ticks (1 tick = 0.5 s): 3600 = minute 30.
# Source of truth: crates/core/scenarios/chaos/; the copy in the
# repository's scenarios/chaos/ directory must match it.

name = "two-dead-robots-and-a-jam"
seed = 1

[floor]
# 64 x 54 cells: a 20 x 15 chute lattice (300 chutes).
width = 64
height = 54
stations = 8
south_margin = 6

[fleet]
robots = 200
# Robots that may head to (or load at) one station at once.
max_inbound_per_station = 6

[arrivals]
# 8 stations x 800/h = 6,400 parcels/h offered (32 per robot per hour).
parcels_per_hour_per_station = 800
destinations = 300
zipf_s_milli = 800

[timing]
# Scan-and-place at induction: 4 ticks = 2 s (about 1,200/h per station at
# full utilisation).
load_ticks = 4
drop_ticks = 2

[chutes]
bag_capacity = 50
bag_swap_ticks = 60
mapping = "popularity_near_induction"

[scanner]
error_rate_ppm = 0

[guidance]
against_flow_cost = 3

[planner]
watchdog_ticks = 600

[[faults]]
kind = "chute-jam"
chute = 289
at = 3600
duration = 1800

[[faults]]
kind = "robot-failure"
robot = 57
at = 3600
duration = 2400

[[faults]]
kind = "robot-failure"
robot = 119
at = 3600
duration = 2400
