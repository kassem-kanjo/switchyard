# Switchyard scenario: small hub.
#
# Calibration (docs/research/2026-10-19-industry-and-client.md, section 4):
# small hubs run 30-60 robots at 1,500-2,000 parcels/h, i.e. 25-50 parcels/h
# per robot, with robots-to-chutes roughly 1:2 to 1:4. These defaults are
# vendor-claimed, range-calibrated, not measured.
#
# Units: 1 tick = 0.5 s, 1 cell = 1 m. Every field is an integer (ADR 0002).

name = "small"
seed = 1

[floor]
# Outer dimensions in cells, walls included.
width = 34
height = 36
# Induction stations, spread evenly along the south edge.
stations = 4
# Free rows kept between the station row and the lowest chute row, so robots
# queueing for induction do not block the sort field.
south_margin = 6

[fleet]
robots = 40

[arrivals]
# 4 stations x 400/h = 1,600 parcels/h offered (40 per robot per hour).
parcels_per_hour_per_station = 400

[timing]
# Manual scan-and-place at induction: 6 ticks = 3 s.
load_ticks = 6
# Tilt-tray drop into the chute: 2 ticks = 1 s.
drop_ticks = 2
